<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <style>
        body {
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f4f4f4;
        }
        form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
        }
        .error {
            color: red;
            font-size: 12px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
        }
        button:disabled {
            background: gray;
        }
    </style>
</head>
<body>

<form id="form">
    <h2>Register</h2>

    <input type="text" id="name" placeholder="Name">
    <div id="nameError" class="error"></div>

    <input type="email" id="email" placeholder="Email">
    <div id="emailError" class="error"></div>

    <input type="password" id="password" placeholder="Password">
    <div id="passwordError" class="error"></div>

    <button id="submitBtn" disabled>Submit</button>
</form>

<!-- Link JavaScript file -->
<script src="script.js"></script>

</body>
</html>
